# CI/CD pipeline for Vigil Engine.
# On every push/PR to main: runs Pint formatting check + full test suite.
# On push to main only: deploys to production.
#
# Required secrets: SSH_PRIVATE_KEY, SERVER_IP
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vigil_business_test
          POSTGRES_USER: vigil_business
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, curl, bcmath, pdo_pgsql

      - name: Copy environment file
        run: |
          cp .env.example .env
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> .env
          echo "AIRTABLE_TOKEN=fake" >> .env
          echo "AIRTABLE_BASE_ID=appFake" >> .env
          echo "TELEGRAM_BOT_TOKEN=fake" >> .env
          echo "TELEGRAM_MY_CHAT_ID=123" >> .env
          echo "TELEGRAM_GROUP_CHAT_ID=-123" >> .env
          echo "SENTRY_LARAVEL_DSN=" >> .env
          echo "GOOGLE_DRIVE_CREDENTIALS=/tmp/fake-credentials.json" >> .env
          echo "GOOGLE_DRIVE_ACT_FOLDER_ID=fakeFolderId" >> .env
          echo "DASHBOARD_USER=vigil" >> .env
          echo "DASHBOARD_PASSWORD=fake" >> .env
          echo "GOOGLE_DRIVE_OAUTH_CLIENT=/tmp/fake-oauth-client.json" >> .env
          echo "GOOGLE_DRIVE_OAUTH_TOKEN=/tmp/fake-oauth-token.json" >> .env

          echo "BUSINESS_DB_HOST=127.0.0.1" >> .env
          echo "BUSINESS_DB_PORT=5432" >> .env
          echo "BUSINESS_DB_DATABASE=vigil_business_test" >> .env
          echo "BUSINESS_DB_USERNAME=vigil_business" >> .env
          echo "BUSINESS_DB_PASSWORD=test_password" >> .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Check code formatting
        run: ./vendor/bin/pint --test

      - name: Run tests
        env:
          APP_ENV: testing
          QUEUE_CONNECTION: sync
          BUSINESS_DB_HOST: 127.0.0.1
          BUSINESS_DB_PORT: 5432
          BUSINESS_DB_DATABASE: vigil_business_test
          BUSINESS_DB_USERNAME: vigil_business
          BUSINESS_DB_PASSWORD: test_password
        run: php artisan test

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Copy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/vigil-engine && GIT_SSH_COMMAND="ssh -i /home/deploy/.ssh/vigil_ed25519" git pull origin main
            cd /var/www/vigil-engine && composer install --no-interaction --prefer-dist --optimize-autoloader
            cd /var/www/vigil-engine && php artisan config:clear
